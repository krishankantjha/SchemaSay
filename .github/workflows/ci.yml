name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          pip install ruff bandit pip-audit
      - name: Compile Python
        run: python -m compileall -q backend/app backend/tests
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: test-secret-key-0123456789-0123456789
          ENCRYPTION_KEY: 7c2w6QFqE7d3hK2x5uXvGmYwQ8rTnZpL0sA1bC2dE3f=
        run: PYTHONPATH=backend pytest -q backend/tests
      - name: Ruff
        run: ruff check backend/app backend/tests
      - name: Bandit
        run: bandit -r backend/app -ll
      - name: Dependency audit
        run: pip-audit -r backend/requirements.txt
      - name: Migration graph
        run: alembic -c backend/alembic.ini heads

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check frontend/js/*.js
